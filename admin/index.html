<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi Fashions - Admin</title>
    <!-- Add this CSS to show loading status -->
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
            color: #333;
        }
        .loader {
            text-align: center;
            padding: 40px;
        }
        .loader .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #E12A2A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader p {
            margin: 8px 0;
            font-size: 14px;
            color: #666;
        }
        .loader .status {
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Loading Admin Panel...</p>
        <p class="status" id="status">Connecting to Decap CMS...</p>
    </div>

    <!-- Load Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    
    <script>
        // Show status updates
        function updateStatus(message) {
            document.getElementById('status').textContent = message;
        }

        updateStatus('Initializing CMS...');

        // Manual initialization for Decap CMS
        window.CMS_MANUAL_INIT = true;

        // Load Decap CMS
        (function() {
            updateStatus('Loading Decap CMS...');
            
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
            
            script.onload = function() {
                updateStatus('✅ CMS Loaded! Logging in...');
                console.log('✅ Decap CMS loaded successfully');
            };
            
            script.onerror = function() {
                updateStatus('❌ Failed to load CMS. Refreshing...');
                console.error('❌ Failed to load Decap CMS');
                // Try reloading after 2 seconds
                setTimeout(() => {
                    location.reload();
                }, 3000);
            };
            
            document.head.appendChild(script);

            // Also try loading from CDN alternative if primary fails
            setTimeout(() => {
                if (typeof window.CMS === 'undefined') {
                    updateStatus('🔄 Trying alternative CDN...');
                    const fallbackScript = document.createElement('script');
                    fallbackScript.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
                    document.head.appendChild(fallbackScript);
                }
            }, 5000);
        })();

        // If after 10 seconds still not loaded, show error
        setTimeout(() => {
            if (typeof window.CMS === 'undefined') {
                document.getElementById('loader').innerHTML = `
                    <div style="text-align:center;padding:40px;color:#e74c3c;">
                        <div style="font-size:48px;margin-bottom:16px;">⚠️</div>
                        <h3>CMS Failed to Load</h3>
                        <p style="color:#666;font-size:14px;">Please check your internet connection and <br> try refreshing the page.</p>
                        <button onclick="location.reload()" style="margin-top:16px;padding:10px 30px;background:#E12A2A;color:white;border:none;border-radius:4px;cursor:pointer;font-size:14px;">
                            Refresh Page
                        </button>
                    </div>
                `;
            }
        }, 12000);

        console.log('🔧 Admin panel loading...');
        console.log('📁 Repository:', 'sreelal1155/lakshmi-fashions');
    </script>
</body>
</html>
