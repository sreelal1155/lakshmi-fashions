<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi Fashions - Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <div id="loading">Loading Admin Panel...</div>
    <script>
        // --- 1. FORCE CMS MANUAL INIT ---
        window.CMS_MANUAL_INIT = true;

        // --- 2. LOAD DECAP CMS ---
        function loadCMS(src) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = function() {
                console.log('✅ CMS loaded from:', src);
                document.getElementById('loading').textContent = '✅ CMS Loaded. Initializing...';
                
                // --- 3. FORCE CMS INITIALIZATION ---
                try {
                    // Check if CMS is available
                    if (typeof window.CMS !== 'undefined') {
                        console.log('✅ CMS object found, initializing...');
                        
                        // Try to call init if it exists
                        if (window.CMS.init) {
                            window.CMS.init();
                            console.log('✅ CMS.init() called successfully');
                            document.getElementById('loading').textContent = '✅ CMS Initialized! The admin panel should appear shortly.';
                        } else {
                            // If no init method, the CMS might auto-init
                            console.log('⚠️ CMS.init not found, waiting for auto-init...');
                            document.getElementById('loading').textContent = '⏳ Waiting for CMS to auto-initialize...';
                            
                            // Check again after a moment
                            setTimeout(() => {
                                if (document.querySelector('.nc-root') || document.querySelector('.cms-root')) {
                                    document.getElementById('loading').textContent = '✅ CMS Interface loaded!';
                                } else {
                                    document.getElementById('loading').textContent = '⚠️ CMS loaded but interface not showing. Check console (F12).';
                                }
                            }, 3000);
                        }
                    } else {
                        console.error('❌ CMS object not found after load!');
                        document.getElementById('loading').textContent = '❌ CMS object not found. Check console (F12).';
                    }
                } catch (error) {
                    console.error('❌ CMS initialization error:', error);
                    document.getElementById('loading').textContent = '❌ Error initializing CMS. See console (F12).';
                }
            };
            
            script.onerror = function() {
                console.error('❌ Failed to load from:', src);
                document.getElementById('loading').textContent = '❌ Failed to load CMS. Please refresh.';
            };
            
            document.head.appendChild(script);
        }

        // Start loading from a reliable CDN
        loadCMS('https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js');

        // --- 4. CHECK FOR config.yml (Most Common Issue) ---
        fetch('/config.yml')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`config.yml not found (HTTP ${response.status})`);
                }
                return response.text();
            })
            .then(text => {
                console.log('✅ config.yml found and loaded successfully.');
            })
            .catch(error => {
                console.error('❌ CRITICAL ERROR:', error.message);
                document.getElementById('loading').innerHTML = `
                    <h3>❌ Configuration Error</h3>
                    <p>${error.message}</p>
                    <p>Make sure <code>config.yml</code> exists in your project's root directory and has been pushed to GitHub.</p>
                `;
            });

        // --- 5. EMERGENCY FALLBACK: Try loading CMS from alternative CDN after 5 seconds ---
        setTimeout(() => {
            if (!document.querySelector('.nc-root') && !document.querySelector('.cms-root')) {
                console.log('⏰ Interface not detected, trying fallback CDN...');
                document.getElementById('loading').textContent = '🔄 Trying alternative CDN...';
                
                // Load from jsDelivr CDN
                const fallbackScript = document.createElement('script');
                fallbackScript.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
                fallbackScript.onload = function() {
                    console.log('✅ CMS loaded from fallback CDN');
                    document.getElementById('loading').textContent = '✅ CMS loaded from fallback. Initializing...';
                    // Try to initialize again
                    if (typeof window.CMS !== 'undefined' && window.CMS.init) {
                        window.CMS.init();
                    }
                };
                document.head.appendChild(fallbackScript);
            }
        }, 5000);
    </script>
</body>
</html>
