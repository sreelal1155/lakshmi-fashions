<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi Fashions - Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <script>
        // Force CMS to load
        window.CMS_MANUAL_INIT = true;

        // Load Decap CMS with fallback
        function loadCMS(src) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = function() {
                console.log('✅ CMS loaded from:', src);
            };
            script.onerror = function() {
                console.error('❌ Failed to load from:', src);
                // Try alternative CDN
                if (src.includes('unpkg')) {
                    loadCMS('https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js');
                }
            };
            document.head.appendChild(script);
        }

        // Start loading
        loadCMS('https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js');

        console.log('🔧 Admin panel initializing...');
        console.log('📁 Repository: sreelal1155/lakshmi-fashions');
    </script>
</body>
</html>
