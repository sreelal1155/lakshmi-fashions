<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakshmi Fashions - Admin</title>
</head>
<body>
  <!-- Netlify CMS -->
  <script>
    // Tell CMS to load config from the admin folder
    window.CMS_MANUAL_INIT = true;
  </script>
  <script src="https://unpkg.com/netlify-cms@^2.0.0/dist/netlify-cms.js"></script>
  <script>
    CMS.init({
      config: {
        load: function() {
          // This path is relative to the site root
          return fetch('/admin/config.yml').then(res => {
            if (!res.ok) throw new Error('Config not found');
            return res.text();
          });
        }
      }
    });
  </script>
</body>
</html>
