<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lakshmi Fashions - Admin</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Decap CMS will inject its own CSS -->
</head>
<body>
  <!-- The CMS will render here -->
  <script>
    // Force manual init
    window.CMS_MANUAL_INIT = true;

    // Load Decap CMS
    (function() {
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
      script.onload = function() {
        console.log('✅ Decap CMS loaded successfully');
        
        // If CMS is loaded but not rendering, try to trigger a re-render
        setTimeout(() => {
          if (typeof window.CMS !== 'undefined') {
            console.log('✅ CMS object found');
            // Try to force a re-render
            if (window.CMS && window.CMS._registry) {
              console.log('✅ CMS registry found');
            }
          }
        }, 1000);
      };
      script.onerror = function() {
        console.error('❌ Failed to load Decap CMS');
        document.body.innerHTML = `
          <div style="text-align:center;padding:50px;font-family:sans-serif;">
            <h2>⚠️ Failed to load CMS</h2>
            <p>Please check your internet connection and refresh the page.</p>
            <button onclick="location.reload()" style="padding:10px 30px;background:#E12A2A;color:white;border:none;border-radius:4px;cursor:pointer;font-size:16px;">
              Refresh
            </button>
          </div>
        `;
      };
      document.head.appendChild(script);
    })();

    console.log('🔧 Admin panel initializing...');
    console.log('📁 Repository: sreelal1155/lakshmi-fashions');
  </script>
</body>
</html>
