<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi Fashions - Admin</title>
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 450px;
            width: 90%;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #E12A2A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
        }
        .sub-status {
            font-size: 14px;
            color: #888;
        }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #E12A2A;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #b82222;
        }
        .btn-outline {
            background: transparent;
            color: #E12A2A;
            border: 2px solid #E12A2A;
        }
        .btn-outline:hover {
            background: #E12A2A;
            color: white;
        }
        .hidden {
            display: none !important;
        }
        .error-box {
            background: #fde8e8;
            border: 1px solid #f5c6c6;
            color: #721c24;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }
        .success-box {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <!-- Loading State -->
        <div id="loading">
            <div class="spinner"></div>
            <div class="status">Loading Admin Panel...</div>
            <div class="sub-status" id="subStatus">Initializing...</div>
        </div>

        <!-- Login State -->
        <div id="login" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">🔐</div>
            <div class="status">Netlify Identity</div>
            <div class="sub-status" style="margin-bottom:16px;">Login with GitHub to manage your store</div>
            <button class="btn" id="loginBtn">
                <i class="fas fa-github"></i> Login with GitHub
            </button>
            <div style="margin-top:12px;font-size:12px;color:#999;">
                Repository: sreelal1155/lakshmi-fashions
            </div>
        </div>

        <!-- Error State -->
        <div id="error" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
            <div class="status" style="color:#e74c3c;">Something went wrong</div>
            <div class="error-box" id="errorMessage">Please try refreshing the page.</div>
            <button class="btn" onclick="location.reload()">Refresh Page</button>
        </div>

        <!-- Success State -->
        <div id="success" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">✅</div>
            <div class="status" style="color:#27ae60;">Connected!</div>
            <div class="success-box">CMS is loading. Please wait...</div>
        </div>
    </div>

    <script>
        // ===== DOM Elements =====
        const loadingEl = document.getElementById('loading');
        const loginEl = document.getElementById('login');
        const errorEl = document.getElementById('error');
        const successEl = document.getElementById('success');
        const subStatus = document.getElementById('subStatus');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        function showLoading(msg = 'Loading...') {
            loadingEl.classList.remove('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
            subStatus.textContent = msg;
        }

        function showLogin() {
            loadingEl.classList.add('hidden');
            loginEl.classList.remove('hidden');
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');
        }

        function showError(msg) {
            loadingEl.classList.add('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.remove('hidden');
            successEl.classList.add('hidden');
            errorMessage.textContent = msg;
        }

        function showSuccess() {
            loadingEl.classList.add('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            successEl.classList.remove('hidden');
        }

        // ===== Netlify Identity =====
        window.netlifyIdentity = window.netlifyIdentity || {};

        // Initialize Netlify Identity
        function initNetlifyIdentity() {
            try {
                if (typeof netlifyIdentity !== 'undefined') {
                    netlifyIdentity.init({
                        locale: 'en',
                        container: '#login'
                    });

                    // On login success
                    netlifyIdentity.on('login', function(user) {
                        console.log('✅ Logged in as:', user.email);
                        showSuccess();
                        // CMS will auto-load after login
                        setTimeout(() => {
                            loadCMS();
                        }, 500);
                    });

                    // On logout
                    netlifyIdentity.on('logout', function() {
                        console.log('👋 Logged out');
                        showLogin();
                    });

                    // On error
                    netlifyIdentity.on('error', function(err) {
                        console.error('❌ Netlify Identity error:', err);
                        showError('Authentication error: ' + (err.message || 'Unknown error'));
                    });

                    // Check if already logged in
                    if (netlifyIdentity.currentUser()) {
                        console.log('✅ Already logged in as:', netlifyIdentity.currentUser().email);
                        showSuccess();
                        loadCMS();
                    } else {
                        showLogin();
                    }

                    return true;
                } else {
                    console.warn('⚠️ Netlify Identity not loaded');
                    return false;
                }
            } catch (error) {
                console.error('❌ Netlify Identity init error:', error);
                showError('Failed to initialize authentication: ' + error.message);
                return false;
            }
        }

        // ===== Load Decap CMS =====
        function loadCMS() {
            console.log('📦 Loading Decap CMS...');
            subStatus.textContent = 'Loading CMS...';

            // Manual init
            window.CMS_MANUAL_INIT = true;

            const script = document.createElement('script');
            script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
            
            script.onload = function() {
                console.log('✅ Decap CMS loaded successfully!');
                subStatus.textContent = '✅ CMS Ready';
                showSuccess();
                
                // CMS should auto-initialize now
                setTimeout(() => {
                    if (typeof window.CMS !== 'undefined') {
                        console.log('✅ CMS is ready for use');
                    } else {
                        console.warn('⚠️ CMS not available after load');
                    }
                }, 2000);
            };
            
            script.onerror = function() {
                console.error('❌ Failed to load Decap CMS');
                showError('Failed to load CMS. Please check your internet connection and try again.');
            };

            // Add a timeout
            const timeout = setTimeout(() => {
                if (typeof window.CMS === 'undefined') {
                    console.warn('⚠️ CMS load timeout');
                    // Try loading from CDN alternative
                    const fallbackScript = document.createElement('script');
                    fallbackScript.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
                    document.head.appendChild(fallbackScript);
                }
            }, 10000);

            document.head.appendChild(script);
        }

        // ===== Login Button Handler =====
        loginBtn.addEventListener('click', function() {
            try {
                if (typeof netlifyIdentity !== 'undefined') {
                    netlifyIdentity.open('login');
                } else {
                    showError('Netlify Identity is not available. Please refresh the page.');
                }
            } catch (error) {
                showError('Error opening login: ' + error.message);
            }
        });

        // ===== Auto-login check =====
        function checkLoginStatus() {
            try {
                if (typeof netlifyIdentity !== 'undefined' && netlifyIdentity.currentUser()) {
                    showSuccess();
                    loadCMS();
                    return true;
                }
                return false;
            } catch {
                return false;
            }
        }

        // ===== Start =====
        showLoading('Initializing...');

        // Check if Netlify Identity loaded
        let attempts = 0;
        const maxAttempts = 20;

        function waitForIdentity() {
            attempts++;
            if (typeof netlifyIdentity !== 'undefined' && netlifyIdentity.init) {
                console.log('✅ Netlify Identity ready');
                subStatus.textContent = 'Authenticating...';
                const initSuccess = initNetlifyIdentity();
                if (!initSuccess) {
                    // Try login check anyway
                    checkLoginStatus();
                }
            } else if (attempts < maxAttempts) {
                subStatus.textContent = 'Waiting for authentication... (' + attempts + '/' + maxAttempts + ')';
                setTimeout(waitForIdentity, 500);
            } else {
                showError('Netlify Identity failed to load. Please refresh the page.');
            }
        }

        // Start waiting
        waitForIdentity();

        // Fallback: Try loading CMS directly after 3 seconds if Netlify Identity fails
        setTimeout(() => {
            if (typeof netlifyIdentity === 'undefined' || !netlifyIdentity.init) {
                console.warn('⚠️ Netlify Identity not available, trying direct CMS load');
                subStatus.textContent = 'Trying direct load...';
                loadCMS();
            }
        }, 5000);

        console.log('🔧 Lakshmi Fashions Admin Panel');
        console.log('📁 Repository:', 'sreelal1155/lakshmi-fashions');
        console.log('🌐 URL:', window.location.href);
    </script>

</body>
</html>
