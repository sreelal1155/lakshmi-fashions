<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lakshmi Fashions - Admin</title>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            max-width: 500px;
            width: 90%;
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #E12A2A;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .status { font-size: 16px; color: #333; margin-bottom: 8px; }
        .sub-status { font-size: 14px; color: #888; }
        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #E12A2A;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background: #b82222; }
        .hidden { display: none !important; }
        .error-box {
            background: #fde8e8;
            border: 1px solid #f5c6c6;
            color: #721c24;
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
            font-size: 14px;
        }
        .log {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 4px;
            font-size: 12px;
            font-family: monospace;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            margin-top: 12px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div id="loading">
            <div class="spinner"></div>
            <div class="status" id="statusText">Loading Admin Panel...</div>
            <div class="sub-status" id="subStatus">Initializing...</div>
            <div class="log" id="debugLog">⏳ Starting...</div>
        </div>

        <div id="login" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">🔐</div>
            <div class="status">Netlify Identity</div>
            <div class="sub-status" style="margin-bottom:16px;">Login with GitHub to manage your store</div>
            <button class="btn" id="loginBtn">Login with GitHub</button>
        </div>

        <div id="error" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
            <div class="status" style="color:#e74c3c;">Something went wrong</div>
            <div class="error-box" id="errorMessage">Please try refreshing the page.</div>
            <button class="btn" onclick="location.reload()">Refresh Page</button>
        </div>

        <div id="cms" class="hidden">
            <div style="font-size:48px;margin-bottom:12px;">✅</div>
            <div class="status" style="color:#27ae60;">CMS Loaded!</div>
            <div class="sub-status">The admin panel should appear below.</div>
        </div>
    </div>

    <script>
        // Debug logging
        const debugLog = document.getElementById('debugLog');
        const statusText = document.getElementById('statusText');
        const subStatusEl = document.getElementById('subStatus');

        function log(msg) {
            console.log('[Admin]', msg);
            if (debugLog) {
                debugLog.textContent += '\n' + msg;
                debugLog.scrollTop = debugLog.scrollHeight;
            }
        }

        function updateStatus(msg, sub = '') {
            statusText.textContent = msg;
            if (sub) subStatusEl.textContent = sub;
            log(msg + (sub ? ' - ' + sub : ''));
        }

        const loadingEl = document.getElementById('loading');
        const loginEl = document.getElementById('login');
        const errorEl = document.getElementById('error');
        const cmsEl = document.getElementById('cms');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        function showLoading(msg = 'Loading...', sub = '') {
            loadingEl.classList.remove('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            cmsEl.classList.add('hidden');
            updateStatus(msg, sub);
        }

        function showLogin() {
            loadingEl.classList.add('hidden');
            loginEl.classList.remove('hidden');
            errorEl.classList.add('hidden');
            cmsEl.classList.add('hidden');
        }

        function showError(msg) {
            loadingEl.classList.add('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.remove('hidden');
            cmsEl.classList.add('hidden');
            errorMessage.textContent = msg;
        }

        function showCMS() {
            loadingEl.classList.add('hidden');
            loginEl.classList.add('hidden');
            errorEl.classList.add('hidden');
            cmsEl.classList.remove('hidden');
        }

        // ===== LOAD CMS DIRECTLY =====
        function loadCMSDirectly() {
            updateStatus('Loading CMS...', 'Fetching from CDN');
            
            // Manual init
            window.CMS_MANUAL_INIT = true;

            // Try primary CDN
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
            
            let loaded = false;

            script.onload = function() {
                if (!loaded) {
                    loaded = true;
                    log('✅ Decap CMS loaded from primary CDN');
                    updateStatus('✅ CMS Loaded!', 'Admin panel ready');
                    setTimeout(() => {
                        showCMS();
                        // Force CMS to initialize
                        if (typeof window.CMS !== 'undefined') {
                            log('✅ CMS is ready for use');
                        } else {
                            log('⚠️ CMS not available after load');
                        }
                    }, 1000);
                }
            };

            script.onerror = function() {
                if (!loaded) {
                    log('❌ Primary CDN failed, trying fallback...');
                    loadFallbackCMS();
                }
            };

            // Timeout for primary CDN
            const timeout = setTimeout(() => {
                if (!loaded) {
                    log('⏰ Primary CDN timeout, trying fallback...');
                    loadFallbackCMS();
                }
            }, 5000);

            document.head.appendChild(script);

            // Cleanup timeout if loaded
            script.onload = function() {
                clearTimeout(timeout);
                if (!loaded) {
                    loaded = true;
                    log('✅ Decap CMS loaded from primary CDN');
                    updateStatus('✅ CMS Loaded!', 'Admin panel ready');
                    setTimeout(() => {
                        showCMS();
                    }, 1000);
                }
            };
        }

        function loadFallbackCMS() {
            log('🔄 Loading from fallback CDN...');
            updateStatus('Loading CMS...', 'Using fallback CDN');
            
            const fallbackScript = document.createElement('script');
            fallbackScript.src = 'https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js';
            
            fallbackScript.onload = function() {
                log('✅ Decap CMS loaded from fallback CDN');
                updateStatus('✅ CMS Loaded!', 'Admin panel ready');
                setTimeout(() => {
                    showCMS();
                }, 1000);
            };

            fallbackScript.onerror = function() {
                log('❌ All CDN attempts failed');
                showError('Failed to load CMS. Please check your internet connection and refresh the page.');
            };

            document.head.appendChild(fallbackScript);
        }

        // ===== NETLIFY IDENTITY =====
        function initIdentity() {
            log('🔑 Initializing Netlify Identity...');
            
            try {
                if (typeof netlifyIdentity !== 'undefined') {
                    netlifyIdentity.init({
                        locale: 'en'
                    });

                    netlifyIdentity.on('login', function(user) {
                        log('✅ Logged in as: ' + user.email);
                        updateStatus('✅ Logged in!', 'Loading CMS...');
                        // Load CMS after login
                        setTimeout(() => {
                            loadCMSDirectly();
                        }, 500);
                    });

                    netlifyIdentity.on('logout', function() {
                        log('👋 Logged out');
                        showLogin();
                    });

                    netlifyIdentity.on('error', function(err) {
                        log('❌ Identity error: ' + (err.message || 'Unknown'));
                        // Try direct CMS load anyway
                        setTimeout(() => {
                            loadCMSDirectly();
                        }, 2000);
                    });

                    // Check if already logged in
                    const user = netlifyIdentity.currentUser();
                    if (user) {
                        log('✅ Already logged in as: ' + user.email);
                        updateStatus('✅ Logged in!', 'Loading CMS...');
                        setTimeout(() => {
                            loadCMSDirectly();
                        }, 500);
                    } else {
                        log('👤 Not logged in, showing login button');
                        showLogin();
                    }
                    return true;
                } else {
                    log('⚠️ Netlify Identity not available');
                    return false;
                }
            } catch (error) {
                log('❌ Identity error: ' + error.message);
                return false;
            }
        }

        // ===== LOGIN BUTTON =====
        loginBtn.addEventListener('click', function() {
            log('🔑 Login button clicked');
            try {
                if (typeof netlifyIdentity !== 'undefined') {
                    netlifyIdentity.open('login');
                } else {
                    log('❌ Netlify Identity not available');
                    showError('Netlify Identity is not available. Please refresh the page.');
                }
            } catch (error) {
                log('❌ Login error: ' + error.message);
                showError('Error opening login: ' + error.message);
            }
        });

        // ===== START =====
        log('🚀 Lakshmi Fashions Admin Panel Starting...');
        log('📁 Repository: sreelal1155/lakshmi-fashions');
        log('🌐 URL: ' + window.location.href);

        showLoading('Starting...', 'Initializing');

        // Try Identity
        let identityAttempts = 0;
        const maxIdentityAttempts = 20;

        function tryIdentity() {
            identityAttempts++;
            if (typeof netlifyIdentity !== 'undefined' && netlifyIdentity.init) {
                log('✅ Netlify Identity ready');
                initIdentity();
            } else if (identityAttempts < maxIdentityAttempts) {
                log('⏳ Waiting for Identity... (' + identityAttempts + '/' + maxIdentityAttempts + ')');
                setTimeout(tryIdentity, 300);
            } else {
                log('⚠️ Identity not available, loading CMS directly');
                // If Identity doesn't load, try CMS directly
                loadCMSDirectly();
            }
        }

        // Wait for Identity to load
        tryIdentity();

        // Emergency fallback: After 8 seconds, try CMS directly
        setTimeout(() => {
            if (document.getElementById('loading').classList.contains('hidden') === false) {
                log('⏰ Emergency fallback: Loading CMS directly');
                loadCMSDirectly();
            }
        }, 8000);

        // After 15 seconds, force reload if still loading
        setTimeout(() => {
            if (document.getElementById('loading').classList.contains('hidden') === false) {
                log('⏰ Force reload after 15 seconds');
                location.reload();
            }
        }, 15000);
    </script>

</body>
</html>
